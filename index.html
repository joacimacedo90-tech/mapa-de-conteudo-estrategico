<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Conteúdo - Planejamento Estratégico para Instagram</title>
    <meta name="description" content="Plataforma de análise e planejamento estratégico de 90 dias para Instagram com IA, diagnóstico de posicionamento, projeção de seguidores e integração com Hotmart." />
    <meta property="og:title" content="Mapa de Conteúdo - Planejamento Estratégico para Instagram" />
    <meta property="og:description" content="Plataforma de análise e planejamento estratégico de 90 dias para Instagram com IA, diagnóstico de posicionamento, projeção de seguidores e integração com Hotmart." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mapa_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-[#ee4957] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
